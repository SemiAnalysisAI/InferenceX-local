[project]
name = "infx-native-client"
version = "0.1.0"
description = "Packages the benchmark clients of a native job run with"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3,<4",
    "huggingface-hub>=1.5,<2",
    "jinja2>=3.1,<4",
    "numpy>=2,<3",
    "tokenizers>=0.22,<1",
    # lm-eval's API models import torch. Serving images include it; a native venv must install it.
    "torch>=2,<3",
    "tqdm>=4,<5",
    "transformers>=5,<6",
]

[tool.uv]
package = false
exclude-newer = "PT12H"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
